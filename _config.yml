title: Byrne Lab Science
tagline: Gene therapy for blindness
description: >-
  The Byrne Lab at the University of Pittsburgh develops gene therapies for
  retinal disease, engineering AAV viral vectors to treat inherited and
  age-related forms of blindness.
url: "https://www.byrnelab.science"
baseurl: ""

institution: University of Pittsburgh
address: Byrne Lab, Mercy Pavilion, 1622 Locust St, Pittsburgh, PA 15219

# Live PubMed author search — updates itself as new papers are indexed, unlike
# the My NCBI bibliography (which stopped being curated in 2021).
#
# If Leah has an ORCID, switching to `ORCID[auid]` here would be strictly
# better: it returns exactly her papers with no name collisions.
#   https://pubmed.ncbi.nlm.nih.gov/?term=0000-0000-0000-0000%5Bauid%5D&sort=date
bibliography_url: https://pubmed.ncbi.nlm.nih.gov/?term=%22Byrne+LC%22%5BAuthor%5D&sort=date

# The old bibliography, kept for reference:
# https://www.ncbi.nlm.nih.gov/myncbi/1b1OChnllzr5w/bibliography/public/

nav:
  - title: Home
    url: /
  - title: Science
    url: /science/
  - title: People
    url: /people/
  - title: Publications
    url: /publications/
  - title: Join
    url: /join/
  - title: Contact
    url: /contact/
  - title: PGTB 2024
    url: /pgtb/

# Build settings
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

sass:
  style: compressed

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - fetch_images.py
  - fetch_pub_figures.py
  - prepare_pub_image.py
  - verify_site.py
  - pub-figures-review
  - fetch.log
  - vendor
  - .github
