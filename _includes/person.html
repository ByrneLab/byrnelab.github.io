{% assign person = include.person %}
<figure class="person">
  {% if person.photo %}
    <img class="person-photo"
         src="{{ '/assets/images/people/' | append: person.photo | relative_url }}"
         alt="{{ person.name | escape }}" loading="lazy" decoding="async">
  {% else %}
    {% comment %}
      No photo — render initials so the grid stays even. Takes the first and
      last name parts only, so a three-part name still yields two letters and
      every avatar matches.
    {% endcomment %}
    {% assign parts = person.name | strip | split: " " %}
    {% assign first_initial = parts.first | slice: 0 %}
    {% assign last_initial = parts.last | slice: 0 %}
    {% if parts.size > 1 %}
      {% capture initials %}{{ first_initial }}{{ last_initial }}{% endcapture %}
    {% else %}
      {% assign initials = first_initial %}
    {% endif %}
    <div class="person-photo person-initials" aria-hidden="true">{{ initials | upcase }}</div>
  {% endif %}

  <figcaption>
    <p class="person-name">{{ person.name }}</p>
    {% if person.role %}
      <p class="person-role">{{ person.role }}</p>
    {% endif %}
    {% if person.links %}
      <p class="person-links">
        {% for link in person.links %}
          <a href="{{ link.url }}" rel="noopener">{{ link.label }}</a>
        {% endfor %}
      </p>
    {% endif %}
  </figcaption>
</figure>
