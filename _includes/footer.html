<footer class="site-footer">
  <div class="wrap footer-inner">
    <div class="footer-col">
      <p class="footer-lab">{{ site.title }}</p>
      <p class="footer-address">{{ site.address }}</p>
    </div>

    <div class="footer-col footer-social">
      {% if site.social.mastodon %}
        <a href="{{ site.social.mastodon }}" rel="me noopener">Mastodon</a>
      {% endif %}
    </div>
  </div>

  <div class="wrap footer-legal">
    <p>&copy; {{ site.time | date: "%Y" }} {{ site.title }} &middot; {{ site.institution }}</p>
  </div>
</footer>
