# Lab members.
#
# Fields:
#   name   (required)
#   role   (optional) — job title, e.g. "Postdoctoral fellow"
#   group  (optional) — pi | postdocs | students | staff
#   photo  (optional) — filename in assets/images/people/
#   links  (optional) — list of {label, url}
#
# With no `role` or `group`, everyone renders as one flat grid with initials
# avatars. Add `role` and `group` and the page automatically splits into
# headed sections (Principal Investigator, Postdoctoral Fellows, Students,
# Staff). Adding a `photo` replaces that person's initials with the image.
#
# Example of a fully specified entry:
#   - name: Jane Doe
#     role: Postdoctoral fellow
#     group: postdocs
#     photo: jane-doe.jpg
#     links:
#       - label: Google Scholar
#         url: https://scholar.google.com/...

